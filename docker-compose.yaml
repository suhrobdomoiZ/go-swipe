services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    # КЛЮЧЕВОЙ МОМЕНТ: Заставляем PostgreSQL слушать порт из .env (5444)
    command: postgres -p ${POSTGRES_PORT}

    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # Healthcheck тоже проверяет порт из .env
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE}
      SECRET_KEY: ${SECRET_KEY}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - uploads-data:/service/uploads
    restart: always

volumes:
  db-data:
  uploads-data: