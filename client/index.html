<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <!-- Шрифты не блокируют отрисовку: если Google Fonts недоступен, приложение остаётся со шрифтом по умолчанию.
         Раньше это был @import в index.css, и он держал применение всех стилей. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>
      /* Стартовый экран до загрузки бандла: без него вебвью показывает пустой чёрный фон. */
      body { margin: 0; background: #07050D; color: #F6F2FB; }
      #boot {
        min-height: 100dvh; box-sizing: border-box; padding: 24px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        text-align: center; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #B9AFD0;
      }
      #boot-text { margin: 0; max-width: 280px; }
      #boot-retry {
        display: none; height: 52px; padding: 0 28px; border: none; border-radius: 999px;
        font: 700 15px system-ui, -apple-system, sans-serif; color: #fff; cursor: pointer;
        background: linear-gradient(140deg, #9333EA 0%, #D946EF 55%, #F97316 100%);
      }
    </style>
  </head>
  <body>
    <!-- React заменит содержимое #root. Если бандл не загрузится, здесь останется понятное сообщение. -->
    <div id="root">
      <div id="boot">
        <p id="boot-text">Загружаем…</p>
        <button id="boot-retry" type="button">Обновить</button>
      </div>
    </div>
    <script>
      (function () {
        var shown = false;
        function fail(text) {
          if (shown || !document.getElementById('boot')) return;
          shown = true;
          document.getElementById('boot-text').textContent = text;
          var retry = document.getElementById('boot-retry');
          retry.style.display = 'inline-block';
          retry.onclick = function () { location.reload(); };
        }
        // Не загрузился свой скрипт или стиль (например, устаревшая ссылка на бандл прошлой сборки).
        window.addEventListener('error', function (e) {
          var el = e.target;
          var url = el && (el.src || el.href);
          if (url && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && url.indexOf(location.origin) === 0) {
            fail('Не удалось загрузить приложение. Обнови страницу.');
          }
        }, true);
        setTimeout(function () { fail('Приложение долго загружается. Попробуй обновить.'); }, 15000);
      })();
    </script>
    <!-- ВРЕМЕННАЯ диагностика: строка состояния поверх экрана, пока в MAX нет консоли. Удалить после починки. -->
    <pre id="diag" style="position:fixed;top:0;left:0;right:0;margin:0;padding:6px 8px;z-index:100000;pointer-events:none;background:rgba(0,0,0,.75);color:#7CFC00;font:10px/1.35 monospace;white-space:pre-wrap"></pre>
    <script>
      (function () {
        var box = document.getElementById('diag');
        function log(t) { box.textContent += t + '\n'; }
        log('build: diag-1 ' + location.href);
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && el !== window && (el.src || el.href)) log('LOAD FAIL: ' + (el.src || el.href));
          else log('ERR: ' + e.message);
        }, true);
        window.addEventListener('unhandledrejection', function (e) { log('REJ: ' + (e.reason && (e.reason.message || e.reason))); });
        window.addEventListener('load', function () {
          log('WebApp: ' + (window.WebApp ? 'yes' : 'NO') + ', initData len: ' + ((window.WebApp && window.WebApp.initData || '').length));
          log('root children: ' + document.getElementById('root').children.length + ', boot: ' + !!document.getElementById('boot'));
        });
        fetch('/api/health').then(function (r) { log('/api/health: ' + r.status); }, function (e) { log('/api/health FAIL: ' + e); });
        setTimeout(function () {
          var r = document.getElementById('root');
          log('t+4s: boot=' + !!document.getElementById('boot') + ' html len=' + r.innerHTML.length + ' text="' + r.innerText.slice(0, 60) + '"');
        }, 4000);
      })();
    </script>
    <!-- MAX Bridge: window.WebApp с initData. В конце body, чтобы медленный st.max.ru не держал пустой экран;
         классический скрипт всё равно выполнится раньше модуля приложения. -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
