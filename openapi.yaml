openapi: 3.0.3
info:
  title: GoSwipe API
  description: >
    Бэкенд мини-аппа «GoSwipe» в мессенджере Макс. Персональная лента мероприятий
    с фильтрами и скорингом по интересам пользователя, без рекомендательной системы.
  version: "1.2.0"

servers:
  - url: http://localhost:8080/api
    description: Локальная разработка

tags:
  - name: auth
    description: Авторизация через MAX и онбординг
  - name: events
    description: Лента, поиск, фильтры, создание мероприятий
  - name: swipes
    description: Лайк/скип карточки на главной
  - name: favorites
    description: Экран избранного
  - name: profile
    description: Профиль и предпочтения
  - name: uploads
    description: Загрузка изображений
  - name: system
    description: Служебные ручки вне префикса /api

paths:
  /health:
    get:
      tags: [system]
      summary: Проверка живости сервера
      description: >
        Без авторизации и вне префикса /api. Caddy эту ручку наружу не проксирует
        (путь отдаёт фронт), она доступна внутри docker-сети:
        docker compose exec server curl -i http://localhost:$PORT/health
      servers:
        - url: http://localhost:8080
          description: Прямой адрес бэкенда внутри docker-сети
      responses:
        "200":
          description: Сервер работает, тело пустое

  /auth/max:
    post:
      tags: [auth]
      summary: Вход через MAX
      description: >
        Проверяет initData, полученный мини-приложением от MAX
        (bridge.getLaunchParams). Если пользователь заходит первый раз —
        создаёт запись в users и возвращает need_onboarding=true.
        Токен — JWT (HS256), срок жизни задаётся переменной JWT_TTL; его нужно
        передавать в заголовке Authorization: Bearer <token>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Сырая строка initData от MAX Bridge
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Сессионный токен для последующих запросов
                  need_onboarding:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Тело запроса не разобралось
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Подпись initData не прошла проверку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/onboarding:
    post:
      tags: [auth]
      summary: Первичная анкета интересов
      description: >
        Заполняется при первом входе: сохраняет город и дату рождения и прибавляет
        +1 к весу каждой выбранной категории в user_interests. Повторный вызов
        не запрещён (город перезаписывается, дата рождения и текст — только если
        переданы, веса категорий прибавляются ещё раз). Пока city у пользователя
        не задан, GET /events отвечает 400.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, categories]
              properties:
                city:
                  type: string
                  maxLength: 64
                  example: Москва
                birth_date:
                  type: string
                  format: date
                  example: "2003-05-14"
                  description: >
                    Полная дата рождения (YYYY-MM-DD). Возраст по ней должен быть
                    от 10 до 110 лет, иначе 400.
                categories:
                  type: array
                  description: >
                    Выбранные на онбординге категории — получат стартовый вес +1.
                    Неизвестные значения игнорируются; должна остаться хотя бы
                    одна валидная, иначе 400.
                  items:
                    $ref: "#/components/schemas/EventCategory"
                onboarding_text:
                  type: string
                  maxLength: 500
                  description: >
                    Свободный текст «люблю то-то». Сохраняется как есть в колонку
                    users.info (длиннее 500 символов обрезается); в теги не
                    разбирается и в скоринге не участвует.
      responses:
        "200":
          description: Профиль заполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Пустой город, нет валидных категорий, неверная дата рождения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    get:
      tags: [events]
      summary: Лента мероприятий (поиск + фильтры + скоринг)
      description: >
        Возвращает события с starts_at в будущем (status=active) в городе
        пользователя (users.city), отсортированные по персональному скору
        (совпадение с user_interests, ближайшие даты чуть выше). Уже
        просмотренные (лайк/скип) исключены. Пока онбординг не пройден
        (город не задан) — 400.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Поиск по названию
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/EventCategory"
        - name: is_free
          in: query
          description: Только бесплатные
          schema:
            type: boolean
        - name: price_max
          in: query
          schema:
            type: integer
        - name: age_limit
          in: query
          description: >
            Максимально допустимый возрастной ценз. Если в профиле есть дата
            рождения, действует меньшее из двух значений (запрошенного и
            возраста пользователя); без параметра берётся возраст из профиля.
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Список карточек для ленты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: Онбординг не пройден, неверная категория или параметр не того типа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [events]
      summary: Создать мероприятие
      description: >
        Экран «создать мероприятие». Событие сохраняется с source='user',
        created_by=id автора и сразу видно всем — модерации нет.
        Появляется в общей ленте (GET /events) сразу же, пока starts_at
        не наступил. starts_at должен быть в будущем, ends_at (если передан) —
        позже starts_at; ends_at можно не передавать или передать null.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Мероприятие создано и сразу видно в ленте
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Ошибка валидации (пустые или слишком длинные поля, неизвестная категория, starts_at не в будущем, ends_at раньше starts_at, отрицательная цена, недопустимый age_limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/mine:
    get:
      tags: [events]
      summary: Мои мероприятия
      description: >
        Все события, созданные текущим пользователем (created_by = id
        текущего пользователя), включая уже прошедшие (finished).
        Формат ответа идентичен GET /events.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Список мероприятий пользователя, отсортирован по starts_at по убыванию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"

  /events/{eventId}:
    get:
      tags: [events]
      summary: Подробная информация о мероприятии
      description: Используется на экране «точно иду» — показывает адрес, ссылку на билеты/регистрацию и т.д.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Полная карточка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: eventId не является UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [events]
      summary: Редактировать своё мероприятие
      description: >
        Полная замена полей события (тело — как у POST /events, все обязательные
        поля нужно передать заново). Править можно только события, созданные
        текущим пользователем (source='user'), и только пока starts_at не наступил.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Мероприятие обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Ошибка валидации или событие уже прошло
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Событие создано не текущим пользователем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventId}/swipe:
    post:
      tags: [swipes]
      summary: Лайк или скип карточки на главной
      description: >
        Пишет строку в swipes и обновляет вес категории/тегов события
        в user_interests (delta: like=+1, skip=-0.5 для категории, половина этого
        для каждого тега). Свайпнуть уже начавшееся событие нельзя.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [like, skip]
      responses:
        "200":
          description: Свайп записан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Swipe"
        "400":
          description: action не like/skip или событие уже прошло
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Событие не найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Событие уже было свайпнуто этим пользователем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /favorites:
    get:
      tags: [favorites]
      summary: Список избранного
      description: >
        Все события с action=like. Сначала «пока не решил» (confirmed=false),
        затем «точно иду»; внутри группы — по дате лайка, новые выше.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: confirmed
          in: query
          description: Фильтр по статусу решения (true = точно иду, false = пока не решил)
          schema:
            type: boolean
      responses:
        "200":
          description: Список избранных карточек
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FavoriteItem"

  /favorites/{eventId}:
    patch:
      tags: [favorites]
      summary: Решение по карточке избранного (свайп влево/вправо)
      description: >
        confirmed=true — «точно иду»: remind_at выставляется на 3 часа до
        starts_at (или на текущий момент, если до начала меньше 3 часов), и в
        это время бот MAX присылает напоминание (проверка раз в минуту).
        confirmed=false возвращает карточку в «пока не решил» и сбрасывает
        remind_at. Ответ включает полную карточку события.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteItem"
        "400":
          description: Поле confirmed не передано или eventId не UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Карточки нет в избранном
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [favorites]
      summary: Убрать карточку из избранного
      description: >
        Строка swipes не удаляется, а переводится в action=skip (confirmed=false,
        remind_at сброшен): событие пропадает из избранного и не возвращается в
        ленту. Вес интересов при этом не пересчитывается.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Удалено
        "404":
          description: Карточки нет в избранном
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profile:
    get:
      tags: [profile]
      summary: Профиль пользователя
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профиль с текущими весами интересов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

    patch:
      tags: [profile]
      summary: Изменить предпочтения
      description: >
        Город, дата рождения, точечная правка весов интересов. Все поля
        независимо опциональны — присылайте только то, что реально
        изменилось. Изменения применяются одной транзакцией: сначала
        users, затем upsert interests, затем remove_interests (тег, попавший
        в оба списка, в итоге удаляется).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                  maxLength: 64
                  description: Не может быть пустым
                birth_date:
                  type: string
                  format: date
                  example: "2003-05-14"
                  description: >
                    YYYY-MM-DD, возраст от 10 до 110 лет. Отсутствие поля, null
                    и пустая строка означают «не менять» — очистить дату
                    рождения через API нельзя.
                interests:
                  type: array
                  description: >
                    Частичное обновление: upsert по тегу (INSERT ... ON
                    CONFLICT (user_id, tag) DO UPDATE SET weight =
                    EXCLUDED.weight). Не полная замена — теги, которых нет
                    в списке, не трогаются и сохраняют текущий вес (в т.ч.
                    выученный по свайпам). Пустой массив [] означает
                    «ничего не апдейтить», а не «удалить все интересы» —
                    для удаления используйте remove_interests. Тег
                    приводится к нижнему регистру (до 128 символов), вес
                    ограничивается диапазоном [-100, 100].
                  items:
                    $ref: "#/components/schemas/Interest"
                remove_interests:
                  type: array
                  description: >
                    Список тегов, которые нужно полностью удалить из
                    интересов пользователя (осознанное действие «убрать
                    категорию»), а не просто оставить без изменений.
                  items:
                    type: string
      responses:
        "200":
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Пустой город, неверный формат или возраст даты рождения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /uploads:
    post:
      tags: [uploads]
      summary: Загрузить обложку мероприятия
      description: >
        Принимает изображение, сохраняет в docker-volume uploads-data на
        сервере (без S3) и возвращает путь вида /uploads/<uuid>.<ext>,
        относительный к хосту приложения (файл раздаёт Caddy → бэкенд без
        авторизации). Этот путь фронт подставляет в EventInput.image_url.
        Тип определяется по содержимому, а не по имени файла. Запрос
        больше 6 МБ отсекается ещё до разбора.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: png, jpeg или webp, не более 5 МБ
      responses:
        "201":
          description: Файл сохранён
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: "/uploads/3f2b1c9e-6a4d-4f4e-9d0e-2b7a5c1e8f90.jpg"
        "400":
          description: Нет поля file, неверный формат (не png/jpeg/webp) или файл превышает 5 МБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Токен, выданный /auth/max. Без токена, с неверной подписью или после
        истечения JWT_TTL любая защищённая ручка отвечает 401 со схемой Error.

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    EventCategory:
      type: string
      enum:
        - music
        - theatre
        - exhibition
        - cinema
        - sport
        - outdoor
        - party
        - food
        - education
        - volunteering
        - other

    EventStatus:
      type: string
      description: >
        Модерации нет — событие видно сразу после создания.
        active — starts_at ещё не наступил. finished — starts_at уже прошёл.
        Оба значения вычисляются бэкендом на чтении, не хранятся и не
        задаются клиентом.
      enum: [active, finished]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        max_user_id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 64
          nullable: true
        city:
          type: string
          maxLength: 64
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time

    Interest:
      type: object
      properties:
        tag:
          type: string
          description: Категория или произвольный тег
        weight:
          type: number
          format: float

    Profile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        interests:
          type: array
          items:
            $ref: "#/components/schemas/Interest"

    EventInput:
      type: object
      required: [title, description, category, city, starts_at]
      properties:
        title:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        category:
          $ref: "#/components/schemas/EventCategory"
        tags:
          type: array
          maxItems: 10
          description: Приводятся к нижнему регистру, дубли и пустые убираются, остаётся не больше 10
          items:
            type: string
        city:
          type: string
          maxLength: 64
        venue:
          type: string
          maxLength: 256
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        price:
          type: integer
          minimum: 0
          default: 0
          description: Цена в рублях, 0 — бесплатно
        age_limit:
          type: integer
          enum: [0, 6, 12, 16, 18]
          default: 0
        url:
          type: string
          maxLength: 512
          nullable: true
          description: Ссылка на билеты или регистрацию
        image_url:
          type: string
          maxLength: 512
          nullable: true
          description: Ссылка на обложку. Можно получить через POST /uploads.

    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/EventStatus"
            source:
              type: string
              description: >
                Откуда событие: user — создано пользователем, synthetic —
                явно помеченные синтетические данные, остальные — внешние
                источники или прочее (other).
              enum:
                - user
                - synthetic
                - afisha.yandex.ru
                - vk.ru
                - www.culture.ru
                - max
                - bilet.mos.ru
                - other
            is_synthetic:
              type: boolean
              description: >
                Вычисляется бэкендом как (source == 'synthetic').
                Тестовые/синтетические данные — явно помечено согласно
                требованиям хакатона.
            created_by:
              type: string
              format: uuid
              nullable: true
            fetched_at:
              type: string
              format: date-time

    EventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer

    Swipe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [like, skip]
        confirmed:
          type: boolean
        created_at:
          type: string
          format: date-time

    FavoriteItem:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/Event"
        confirmed:
          type: boolean
          description: true = «точно иду», false = «пока не решил»
        remind_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - NOT_FOUND
            - UNAUTHORIZED
            - FORBIDDEN
            - CONFLICT
            - INTERNAL_SERVER_ERROR
        message:
          type: string